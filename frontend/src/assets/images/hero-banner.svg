    <rect x="24" y="88" width="160" height="16" rx="6" fill="#FFFFFF" fill-opacity="0.85"/>
    <rect x="24" y="118" width="190" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.35"/>
    <rect x="24" y="134" width="170" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.35"/>
    <rect x="24" y="160" width="96" height="30" rx="15" fill="#FF7900"/>
    <rect x="130" y="160" width="96" height="30" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="250" y="62" width="126" height="128" rx="12" fill="#FF7900" fill-opacity="0.18" stroke="#FF7900" stroke-opacity="0.6"/>
    <path d="M272 168l28-40 22 26 14-16 22 30z" fill="#FF7900"/>
    <circle cx="344" cy="92" r="10" fill="#FFFFFF" fill-opacity="0.8"/>
    <rect x="24" y="212" width="108" height="56" rx="10" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="146" y="212" width="108" height="56" rx="10" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="268" y="212" width="108" height="56" rx="10" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="36" y="226" width="40" height="8" rx="4" fill="#FF7900"/>
    <rect x="158" y="226" width="40" height="8" rx="4" fill="#FF7900"/>
    <rect x="280" y="226" width="40" height="8" rx="4" fill="#FF7900"/>
    <rect x="36" y="242" width="80" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.3"/>
